name: Update GitHub Profile Repositories

on: schedule:


- cron: "17 4 * * *"
workflow_dispatch:

permissions: contents: write

jobs: update-profile: runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Update public repositories
    run: python scripts/update_repositories.py
    env:
      GITHUB_USERNAME: abdussaboorq
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit and push changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      if git diff --quiet; then
        echo "No changes to commit."
      else
        git add README.md
        git commit -m "chore: update public repositories"
        git push
      fi
